<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila - Sistema de Atendimento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card fila-card">
            <h1>Clínica Fácil</h1>
            <p class="subtitulo">Sistema de Atendimento</p>
            <h2>Fila de Atendimento</h2>
            <div class="senha-atual">
                <p>Senha atual</p>
                <strong id="senhaAtual">A000</strong>
            </div>
            <div class="info-fila">
                <p>Próxima senha:</p>
                <strong id="proximaSenha">A001</strong>
            </div>
            <button id="gerarSenha">Gerar minha senha</button>
            <p id="minhaSenha"></p>
            <button class="botao-secundario" id="sair">Sair</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
