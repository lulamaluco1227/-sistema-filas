<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Filas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Clínica Fácil</h1>
            <p class="subtitulo">Sistema de Atendimento</p>
            <h2>Cadastro</h2>
            <form id="cadastroForm">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome">
                <label for="emailCadastro">E-mail</label>
                <input type="email" id="emailCadastro" placeholder="Digite seu e-mail">
                <label for="senhaCadastro">Senha</label>
                <input type="password" id="senhaCadastro" placeholder="Digite sua senha">
                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente">
                <button type="submit">Cadastrar</button>
            </form>
            <p id="mensagemCadastro"></p>
            <p class="link">
                Já possui cadastro?
                <a href="index.html">Voltar para o login</a>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
